name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run repository quality gates
        run: bun run quality

  catalogue:
    name: Validate catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Verify reviewed identities and generated files
        shell: bash
        run: |
          set -euo pipefail
          bun run catalogue:reconcile
          if ! git diff --quiet -- packages/json/catalogue/unresolved.json; then
            git diff -- packages/json/catalogue/unresolved.json
            echo "The unresolved report is stale. Commit the reconciled file." >&2
            exit 1
          fi

          bun run catalogue:render --output "$RUNNER_TEMP/free-models.json"
          bun run catalogue:check --input "$RUNNER_TEMP/free-models.json"
