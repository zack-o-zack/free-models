name: Verify merged catalogue

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run repository quality gates
        run: bun run quality

  catalogue:
    name: Validate catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Verify approved generated files
        shell: bash
        run: |
          set -euo pipefail
          bun run catalogue:reconcile
          if ! git diff --quiet -- packages/json/catalogue/unresolved.json; then
            git diff -- packages/json/catalogue/unresolved.json
            echo "The merged unresolved report is stale." >&2
            exit 1
          fi

          bun run catalogue:render --output "$RUNNER_TEMP/free-models.json"
          bun run catalogue:check --input "$RUNNER_TEMP/free-models.json"

      - name: Save rendered catalogue for publication
        uses: actions/upload-artifact@v4
        with:
          name: free-models-json
          path: ${{ runner.temp }}/free-models.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish catalogue to R2
    needs:
      - quality
      - catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download rendered catalogue
        uses: actions/download-artifact@v4
        with:
          name: free-models-json
          path: ${{ runner.temp }}

      - name: Upload catalogue to Cloudflare R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            r2 object put free-models-cdn/free-models.json
            --remote
            --file ${{ runner.temp }}/free-models.json
            --content-type application/json
            --cache-control "public, max-age=300, s-maxage=300"
