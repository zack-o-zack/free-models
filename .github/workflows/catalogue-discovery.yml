name: Discover free models

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate discovery and agent review without pushing or merging
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: free-model-catalogue-discovery
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/free-model-catalogue
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  discover:
    name: Discover, repair, review and merge catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.dry_run && github.sha || github.event.repository.default_branch }}

      - name: Prepare fresh candidate and preserve baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CATALOGUE_BASELINE="$RUNNER_TEMP/catalogue-baseline"
          echo "CATALOGUE_BASELINE=$CATALOGUE_BASELINE" >> "$GITHUB_ENV"
          mkdir -p "$CATALOGUE_BASELINE"
          cp -R packages/json/catalogue "$CATALOGUE_BASELINE/catalogue"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          old_sha=$(git ls-remote origin "refs/heads/$AUTOMATION_BRANCH" | cut -f1)
          echo "OLD_SHA=$old_sha" >> "$GITHUB_ENV"
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$old_sha" && -n "$pending" ]]; then
            git fetch origin "$AUTOMATION_BRANCH"
            # Never overwrite human repairs or executable changes in a pending proposal.
            git log "HEAD..$old_sha" --format=%ae > "$RUNNER_TEMP/authors"
            if grep -vFx '41898282+github-actions[bot]@users.noreply.github.com' "$RUNNER_TEMP/authors"; then
              echo 'Automation branch has human commits; resolve it before retrying.' >&2
              exit 1
            fi
            git diff --name-only "HEAD...$old_sha" > "$RUNNER_TEMP/paths"
            if grep -vE '^packages/json/catalogue/(canonical-models.json|canonical-metadata.json|unresolved.json|(mappings|snapshots)/[a-z0-9-]+\.json)$' "$RUNNER_TEMP/paths"; then
              echo 'Automation branch contains changes outside the catalogue.' >&2
              exit 1
            fi
          fi
          git switch -c catalogue-candidate

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Discover provider offers
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_FREE_API_KEY: ${{ secrets.MISTRAL_FREE_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: bun run catalogue:discover

      - name: Resolve identities using free catalogue models
        id: repair
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun packages/json/src/automation/run.ts repair

      - name: Refresh resolved metadata
        if: steps.repair.outcome == 'success'
        id: refresh
        continue-on-error: true
        run: bun run catalogue:refresh

      - name: Review catalogue using free catalogue models
        if: steps.refresh.outcome == 'success'
        id: review
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun packages/json/src/automation/run.ts review

      - name: Validate exact candidate
        if: steps.review.outcome == 'success'
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          bun run check

      - name: Save catalogue and agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-catalogue
          path: |
            packages/json/catalogue/
            .scratch/catalogue-agent-report.json
          include-hidden-files: true
          retention-days: 14

      - name: Commit proposal and open or update one pull request
        if: ${{ !inputs.dry_run && !cancelled() && steps.repair.outcome != '' }}
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ steps.validate.outcome == 'success' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/json/catalogue; then
            exit 0
          fi
          git add -- packages/json/catalogue
          git commit -m 'chore: update free model catalogue'
          git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:$OLD_SHA" origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          body="$RUNNER_TEMP/catalogue-pull-request.md"
          {
            echo 'Daily catalogue discovery, bounded identity repair, free-model review and deterministic validation.'
            echo
            echo "All gates passed: $VALIDATED"
            echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Failures remain open and are retried on the next schedule. Human commits stop automatic branch replacement.'
            echo 'The model has no shell, repository credentials, or merge authority.'
          } > "$body"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title 'chore: update free model catalogue' --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$AUTOMATION_BRANCH" --title 'chore: update free model catalogue' --body-file "$body"
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Merge only the validated commit
        if: steps.validate.outcome == 'success' && steps.proposal.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.number }}
        run: bun packages/json/src/automation/merge.ts

      - name: Dispatch verified catalogue publication
        if: steps.validate.outcome == 'success' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merged-catalogue.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

      - name: Report blocked automation
        if: ${{ !cancelled() && steps.repair.outcome != '' && steps.validate.outcome != 'success' }}
        run: |
          echo 'Catalogue autopilot stopped. See the evidence artifact and pending PR.' >&2
          exit 1
