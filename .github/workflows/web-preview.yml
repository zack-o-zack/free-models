name: Deploy web preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      SITE_ENVIRONMENT: preview

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build static export
        run: bun run --filter web build

      - name: Verify static preview artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -f apps/web/out/compare.html
          test -f apps/web/out/_headers
          test -f apps/web/out/_redirects
          grep -q "noindex" apps/web/out/index.html
          grep -q "Disallow: /" apps/web/out/robots.txt

      - name: Deploy to Cloudflare Pages
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: apps/web
          gitHubToken: ${{ github.token }}
          command: >-
            pages deploy out
            --project-name=free-models
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=true

      - name: Comment preview URL
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const aliasUrl = process.env.ALIAS_URL;
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const previewUrl = aliasUrl || deploymentUrl;
            if (!previewUrl) throw new Error("Cloudflare Pages did not return a preview URL");

            const marker = "<!-- cloudflare-pages-preview -->";
            const lines = [
              marker,
              "### Cloudflare Pages preview",
              "",
              `[Open PR preview](${previewUrl})`,
              "",
              `Built from \`${process.env.COMMIT_SHA}\`.`,
            ];
            if (deploymentUrl && deploymentUrl !== previewUrl) {
              lines.push("", `[View immutable deployment](${deploymentUrl})`);
            }
            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Record fork preview policy
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Fork pull requests receive build validation only; no repository secrets are used." >> "$GITHUB_STEP_SUMMARY"
