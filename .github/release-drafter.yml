name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels:
      - feature
      - enhancement
  - title: "Bug Fixes"
    labels:
      - fix
      - bug
  - title: "Maintenance"
    labels:
      - chore
      - dependencies
      - documentation

version-resolver:
  major:
    labels:
      - breaking-change
      - major
  minor:
    labels:
      - feature
      - enhancement
  patch:
    labels:
      - fix
      - bug
      - chore
      - dependencies
      - documentation
  default: patch

exclude-labels:
  - skip-changelog

change-template: "- $TITLE by @$AUTHOR (#$NUMBER)"

template: |
  ## What's Changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
